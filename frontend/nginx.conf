server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_read_timeout 300s; # full-table XLSX exports take a while
  }
  location / {
    try_files $uri /index.html;
  }
  # index.html must be revalidated on every load, or browsers keep pointing at the previous
  # bundle after a rebuild. try_files falls back here too, so "/" and hash routes are covered.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  # Vite fingerprints asset file names, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
