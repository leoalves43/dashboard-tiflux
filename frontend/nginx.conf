server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json;

  # Docker's DNS + a variable make nginx re-resolve "api"; a literal host is resolved once at start,
  # so recreating the api container (new IP) left every /api call at 502 until web restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ {
    set $api_upstream http://api:8000;
    proxy_pass $api_upstream;
    proxy_read_timeout 300s; # full-table XLSX exports take a while
  }
  location / {
    try_files $uri /index.html;
  }
  # index.html must be revalidated on every load, or browsers keep pointing at the previous
  # bundle after a rebuild. try_files falls back here too, so "/" and hash routes are covered.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  # Vite fingerprints asset file names, so they can be cached for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
