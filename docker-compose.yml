name: dashboard-tiflux

services:
  api:
    build: ./backend
    image: dashboard-tiflux-backend
    restart: unless-stopped
    env_file: .env
    # Postgres is remote (DB_HOST in .env); host-gateway kept so DB_HOST=host.docker.internal still works for a local DB
    extra_hosts: &host_gateway
      - "host.docker.internal:host-gateway"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  sync:
    build: ./backend
    image: dashboard-tiflux-backend
    restart: unless-stopped
    env_file: .env
    extra_hosts: *host_gateway
    command: ["python", "-m", "app.sync.runner"]

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT}:80"
    depends_on:
      api:
        condition: service_healthy
