[project]
name = "dashboard-tiflux"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.1",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "pydantic-settings==2.15.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = { find = { include = ["app*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# Files are mounted from Windows, so every file looks executable.
ignore = ["EXE002"]
